    <h1>HTML structure</h1>
      <p>HTML has a structure to start of every html code!</p>
      <p>&lt;!DOCTYPE html&gt;</p>
      <p>This is the decleration! It tells the browser that this is an HTML5 file. And no, you cannot code HTML5 and HTML4 together.</p>
      <p>&lt;html&gt;</p>
      <p>This is basically the container. Some people put &lt;html lang=en&gt;</p>
  </body>
